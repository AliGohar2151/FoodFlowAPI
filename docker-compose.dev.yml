# ── FoodFlow Docker Compose — Development Override ────────────────────────────
# Use this file for local development with hot-reload.
# It overrides the production docker-compose.yml to:
#   - Skip building the Docker image
#   - Mount source code directly into the container
#   - Use tsx for hot-reload instead of compiled JS
#   - Expose additional debugging ports
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml logs -f api

name: foodflow

services:
  api:
    build:
      target: deps # Stop at the deps stage (no compilation)
    command: ["node", "--import", "tsx", "src/server.ts"]
    environment:
      NODE_ENV: development
    volumes:
      - .:/app # Mount entire project for hot-reload
      - /app/node_modules # Keep container's node_modules separate

  worker:
    build:
      target: deps
    command: ["node", "--import", "tsx", "src/worker.ts"]
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
